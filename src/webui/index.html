<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>软件功能安全文档生成器</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- highlight.js theme -->
  <link id="hljs-theme" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css" rel="stylesheet" />
  <link href="/static/css/style.css?v=3.8" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">
    <!-- ==================== 侧边栏（配置） ==================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">🛡️</span>
        <div>
          <div class="sidebar-title">功能安全文档生成器</div>
          <div class="sidebar-subtitle">ISO 26262 / ASPICE</div>
        </div>
      </div>
      <div class="sidebar-body" id="sidebar-body">
        <!-- 由 sidebar.js 渲染 -->
      </div>
    </aside>

    <!-- ==================== 主区 ==================== -->
    <main class="main">
      <header class="main-header">
        <ul class="nav nav-pills view-tabs" id="view-tabs">
          <li class="nav-item">
            <button class="nav-link active" data-view="dashboard">
              <i class="bi bi-grid-1x2"></i> 工程总览
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-view="workspace">
              <i class="bi bi-pencil-square"></i> 单文档工作台
            </button>
          </li>
        </ul>
        <div class="header-status" id="header-status"></div>
      </header>

      <div class="disclaimer-box">
        ⚠️ <strong>免责声明</strong>：本工具生成的文档由 AI 辅助产出，仅供功能安全分析参考。所有分析结论和建议措施须由具备资质的功能安全工程师进行人工审查和确认。
      </div>

      <section class="view" id="view-dashboard"><!-- dashboard.js --></section>
      <section class="view d-none" id="view-workspace"><!-- workspace.js --></section>
    </main>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

  <!-- 全局遮罩 -->
  <div class="global-overlay d-none" id="global-overlay">
    <div class="spinner-border text-light" role="status"></div>
    <div class="overlay-text" id="overlay-text">处理中...</div>
  </div>

  <!-- 依赖库 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
  <!-- 应用脚本（?v=3.8 强制刷新缓存，避免浏览器使用旧版 JS） -->
  <script src="/static/js/api.js?v=3.8"></script>
  <script src="/static/js/state.js?v=3.8"></script>
  <script src="/static/js/sidebar.js?v=3.8"></script>
  <script src="/static/js/dashboard.js?v=3.8"></script>
  <script src="/static/js/workspace.js?v=3.8"></script>
  <script src="/static/js/main.js?v=3.8"></script>
</body>
</html>
